name: MLOps Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  train-and-evaluate:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        pip install pandas
        pip install numpy
        pip install scikit-learn
        pip install joblib
        pip install mlflow
        pip install fastapi
        pip install uvicorn

    - name: Run Model Training
      run: |
        python src/models/train.py

    - name: Run Model Evaluation
      run: |
        python src/models/evaluate.py